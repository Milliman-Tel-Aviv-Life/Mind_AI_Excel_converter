- id: FRM-001
  version: 1.0.0
  status: active
  category: formula
  description: Formula Inventory -- Audit every formula used.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FRM-001
