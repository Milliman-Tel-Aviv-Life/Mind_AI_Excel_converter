version: 1.0.0
rules:
- id: FORMAT-001
  version: 1.0.0
  status: active
  category: format
  description: Preserve supported cell types, basic formatting, merged cells, validation, notes, and outlines
    where possible.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: CompleteMindDocn.docx
    article: excel-specificities-kept-in-mind
  validation:
    deterministic: true
    implementation: validators.format.compare_semantic_features
  correction:
    automatic: false
  on_unevaluable: WARNING
- id: FMT-001
  version: 1.0.0
  status: active
  category: format
  description: 'Supported Formats -- Allowed: - Standard - Number - Text - Boolean - Date - Data Validation
    - Hyperlink'
  confidence: HIGH
  priority: RECOMMENDED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FMT-001
  validation:
    deterministic: false
    implementation: validators.format.fmt_001
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  severity_source: MEDIUM
- id: FMT-002
  version: 1.0.0
  status: active
  category: format
  description: 'Excel Styles -- Pass if: Workbook does not rely on unsupported theme formatting.'
  confidence: HIGH
  priority: RECOMMENDED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FMT-002
  validation:
    deterministic: false
    implementation: validators.format.fmt_002
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
